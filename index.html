<title>Pep Talk Press</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    --paper:#E9E9F2; --paper-slip:#FBFAF7; --ink:#17161D; --ink-soft:#6C6A80;
    --fluoro:#FF3D8B; --blue:#2B4BE0; --yellow:#FFC53D; --rule:#C9C9DA;
    --blend:multiply; --grain:.30; --duo-op:.34; --pic-bright:1.04;
    --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
    --serif:'Newsreader',Georgia,serif;
    --mono:'Space Mono',ui-monospace,'Courier New',monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#14131A; --paper-slip:#201E2A; --ink:#F0EEF7; --ink-soft:#918EA8;
      --fluoro:#FF5C9E; --blue:#7C90FF; --yellow:#FFD166; --rule:#35323F;
      --blend:screen; --grain:.16; --duo-op:.20; --pic-bright:.92;
    }
  }
  :root[data-theme="dark"] {
    --paper:#14131A; --paper-slip:#201E2A; --ink:#F0EEF7; --ink-soft:#918EA8;
    --fluoro:#FF5C9E; --blue:#7C90FF; --yellow:#FFD166; --rule:#35323F;
    --blend:screen; --grain:.16; --duo-op:.20; --pic-bright:.92;
  }

  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:var(--serif); display:flex; flex-direction:column; align-items:center;
    padding:26px 20px 18px; gap:22px; overflow-x:hidden;
  }

  .grain {
    position:fixed; inset:0; z-index:20; pointer-events:none;
    opacity:var(--grain); mix-blend-mode:var(--blend);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  }

  .reg { position:fixed; width:17px; height:17px; color:var(--blue); opacity:.5; z-index:3; pointer-events:none; }
  .reg.tl{top:16px;left:16px}.reg.tr{top:16px;right:16px;color:var(--fluoro)}
  .reg.bl{bottom:16px;left:16px;color:var(--fluoro)}.reg.br{bottom:16px;right:16px}

  header { text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .imprint { font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-soft); }
  .wordmark { font-family:var(--display); font-weight:800; font-size:clamp(1.5rem,4.6vw,2.15rem); letter-spacing:-.035em; line-height:1; margin:0; }
  .wordmark em { font-style:normal; color:var(--fluoro); }

  .moods { display:flex; flex-wrap:wrap; justify-content:center; gap:7px; max-width:640px; }
  .chip {
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.07em;
    text-transform:uppercase; padding:6px 13px; border:1.5px solid var(--rule);
    background:transparent; color:var(--ink-soft); border-radius:2px; cursor:pointer;
    transition:color .16s,border-color .16s,background .16s,transform .16s;
  }
  .chip:hover { color:var(--ink); border-color:var(--ink-soft); transform:translateY(-1px); }
  .chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .chip:focus-visible,.press:focus-visible,.mini:focus-visible,.sound:focus-visible { outline:2.5px solid var(--blue); outline-offset:3px; }

  .stage { position:relative; width:min(660px,100%); flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:280px; }
  .slip {
    position:relative; width:100%; background:var(--paper-slip); border:1.5px solid var(--rule);
    padding:clamp(26px,4.6vw,40px) clamp(24px,4.4vw,42px) clamp(20px,3vw,28px);
    display:flex; flex-direction:column; gap:18px; transform:rotate(-.7deg);
  }
  .inkblock {
    position:absolute; inset:0; background:var(--fluoro); opacity:.16;
    mix-blend-mode:var(--blend); z-index:-1; transform:translate(9px,9px);
    transition:transform .55s cubic-bezier(.16,1,.3,1);
  }
  .tag { font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--blue); }

  .msg-wrap { position:relative; }
  .msg, .msg-ghost {
    font-family:var(--display); font-weight:700; font-size:clamp(1.32rem,3.9vw,1.95rem);
    line-height:1.25; letter-spacing:-.025em; text-wrap:balance; margin:0;
  }
  .msg { position:relative; z-index:1; }
  .msg-ghost {
    position:absolute; inset:0; color:var(--fluoro); mix-blend-mode:var(--blend);
    opacity:.85; z-index:0; pointer-events:none; user-select:none;
    transform:translate(3px,2px); transition:transform .55s cubic-bezier(.16,1,.3,1);
  }
  .slip.printing .inkblock  { transform:translate(22px,16px); transition:none; }
  .slip.printing .msg-ghost { transform:translate(11px,7px); transition:none; }

  .cosign { display:flex; gap:15px; align-items:flex-start; border-top:1.5px solid var(--rule); padding-top:16px; }
  .cosign-pic { position:relative; width:62px; height:62px; flex:none; overflow:hidden; border:1.5px solid var(--rule); background:var(--rule); }
  .cosign-pic img { width:100%; height:100%; object-fit:cover; object-position:50% 16%; display:block; filter:grayscale(1) contrast(1.12) brightness(var(--pic-bright)); }
  .cosign-pic::after { content:''; position:absolute; inset:0; background:var(--fluoro); mix-blend-mode:var(--blend); opacity:var(--duo-op); pointer-events:none; }
  .cosign-txt { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .cosign-label { font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft); }
  .cosign-name { font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:-.01em; }
  .cosign-fact { font-family:var(--serif); font-size:14.5px; line-height:1.45; color:var(--ink-soft); margin:0; }

  .slipfoot { display:flex; align-items:center; justify-content:space-between; gap:16px; font-family:var(--mono); font-size:11px; color:var(--ink-soft); }
  .runno { font-variant-numeric:tabular-nums; letter-spacing:.06em; }
  .mini {
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; background:none; border:none; color:var(--ink-soft);
    cursor:pointer; padding:4px 2px; border-bottom:1.5px solid transparent;
    transition:color .16s,border-color .16s;
  }
  .mini:hover { color:var(--fluoro); border-bottom-color:var(--fluoro); }

  .controls { display:flex; flex-direction:column; align-items:center; gap:11px; }
  .press {
    font-family:var(--display); font-weight:800; font-size:1rem; color:var(--paper-slip);
    background:var(--ink); border:none; padding:15px 38px; border-radius:999px;
    cursor:pointer; box-shadow:4px 4px 0 var(--fluoro); transition:transform .13s,box-shadow .13s;
  }
  .press:hover { transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--fluoro); }
  .press:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--fluoro); }

  .underbar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:center; }
  .hint { font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); }
  .hint kbd { font-family:var(--mono); border:1.5px solid var(--rule); border-radius:3px; padding:1px 5px; font-size:10px; }
  .sound {
    font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.12em;
    text-transform:uppercase; background:transparent; border:1.5px solid var(--rule);
    color:var(--ink-soft); border-radius:999px; padding:6px 14px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; transition:color .16s,border-color .16s;
  }
  .sound:hover { color:var(--ink); border-color:var(--ink-soft); }
  .sound[aria-pressed="true"] { color:var(--fluoro); border-color:var(--fluoro); }
  .bars { display:inline-flex; align-items:flex-end; gap:2px; height:11px; }
  .bars i { width:2.5px; background:currentColor; height:3px; display:block; }
  .sound[aria-pressed="true"] .bars i { animation:bounce .9s ease-in-out infinite; }
  .sound[aria-pressed="true"] .bars i:nth-child(2){animation-delay:.15s}
  .sound[aria-pressed="true"] .bars i:nth-child(3){animation-delay:.3s}
  @keyframes bounce { 0%,100%{height:3px} 50%{height:11px} }

  footer { font-family:var(--serif); font-style:italic; font-size:14px; color:var(--ink-soft); text-align:center; max-width:48ch; line-height:1.5; }
  .credit { font-family:var(--mono); font-style:normal; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; display:block; margin-top:8px; opacity:.75; }

  .toast {
    position:fixed; bottom:24px; left:50%; transform:translate(-50%,20px);
    background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px;
    font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:11px 20px;
    border-radius:2px; opacity:0; pointer-events:none; transition:opacity .22s,transform .22s; z-index:30;
  }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion: reduce) {
    *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; }
    .slip.printing .inkblock { transform:translate(9px,9px); }
    .slip.printing .msg-ghost { transform:translate(3px,2px); }
  }
  @media (max-width:560px) {
    .reg { display:none; }
    .slip { transform:none; }
    .slipfoot { flex-direction:column; align-items:flex-start; gap:9px; }
    .cosign { gap:12px; }
    .cosign-pic { width:52px; height:52px; }
  }
</style>

<svg class="reg tl" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="10" cy="10" r="5.5"/><path d="M10 0v20M0 10h20"/></svg>
<svg class="reg tr" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="10" cy="10" r="5.5"/><path d="M10 0v20M0 10h20"/></svg>
<svg class="reg bl" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="10" cy="10" r="5.5"/><path d="M10 0v20M0 10h20"/></svg>
<svg class="reg br" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="10" cy="10" r="5.5"/><path d="M10 0v20M0 10h20"/></svg>

<header>
  <span class="imprint">Small batch &middot; Printed to order</span>
  <h1 class="wordmark">Pep Talk <em>Press</em></h1>
</header>

<nav class="moods" id="moods" aria-label="Pick how you're feeling"></nav>

<main class="stage">
  <article class="slip" id="slip">
    <div class="inkblock" aria-hidden="true"></div>
    <span class="tag" id="tag">Everything</span>
    <div class="msg-wrap">
      <p class="msg-ghost" id="ghost" aria-hidden="true"></p>
      <p class="msg" id="msg" aria-live="polite"></p>
    </div>
    <div class="cosign">
      <div class="cosign-pic"><img id="cosignImg" alt="" width="62" height="62"></div>
      <div class="cosign-txt">
        <span class="cosign-label">Co-signed by</span>
        <span class="cosign-name" id="cosignName"></span>
        <p class="cosign-fact" id="cosignFact"></p>
      </div>
    </div>
    <div class="slipfoot">
      <span class="runno" id="runno"></span>
      <button class="mini" id="copy" type="button">Copy for a friend</button>
    </div>
  </article>
</main>

<div class="controls">
  <button class="press" id="press" type="button">Print another</button>
  <div class="underbar">
    <span class="hint">or press <kbd>space</kbd></span>
    <button class="sound" id="sound" type="button" aria-pressed="false">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="soundLabel">Music off</span>
    </button>
  </div>
</div>

<footer>
  Made for the days that need it. Send one to someone who has been quiet lately.
  <span class="credit">Portraits: public domain, via Wikimedia Commons</span>
</footer>

<div class="toast" id="toast">Copied</div>

<script>
/* ---------- sound: everything synthesised, no files ---------- */
var Sound = (function () {
  var ctx = null, master = null, musicBus = null;
  var on = false, timer = null, step = 0, nextTime = 0, noise = null;
  var BPM = 94, STEP = 60 / BPM / 2, AHEAD = 0.2;

  // C - G - Am - F, close voicings so the pad doesn't jump around.
  var BARS = [
    { bass: 130.81, pad: [261.63, 329.63, 392.00] },
    { bass:  98.00, pad: [246.94, 293.66, 392.00] },
    { bass: 110.00, pad: [220.00, 261.63, 329.63] },
    { bass:  87.31, pad: [174.61, 220.00, 261.63] }
  ];
  var ARP = [0, 2, 1, 2, 0, 1, 2, 1];

  function init() {
    if (ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.9;
    var warm = ctx.createBiquadFilter();
    warm.type = "lowpass";
    warm.frequency.value = 3200;
    master.connect(warm);
    warm.connect(ctx.destination);
    musicBus = ctx.createGain();
    musicBus.gain.value = 0.0;
    musicBus.connect(master);

    var len = Math.floor(ctx.sampleRate * 0.5);
    noise = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = noise.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }

  function pad(freqs, t, dur) {
    freqs.forEach(function (f, i) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = f;
      o.detune.value = (i - 1) * 5;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.28);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(musicBus);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }

  function bass(f, t, dur) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.9);
    o.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + dur);
  }

  function pluck(f, t) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle";
    o.frequency.value = f * 2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    o.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + 0.36);
  }

  function hat(t, loud) {
    var s = ctx.createBufferSource(), g = ctx.createGain(), hp = ctx.createBiquadFilter();
    s.buffer = noise;
    hp.type = "highpass";
    hp.frequency.value = 7500;
    g.gain.setValueAtTime(loud ? 0.05 : 0.022, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(hp); hp.connect(g); g.connect(musicBus);
    s.start(t); s.stop(t + 0.06);
  }

  function tick() {
    while (nextTime < ctx.currentTime + AHEAD) {
      var inBar = step % 8, bar = BARS[Math.floor(step / 8) % 4];
      if (inBar === 0) {
        pad(bar.pad, nextTime, STEP * 8);
        bass(bar.bass, nextTime, STEP * 3.4);
      }
      if (inBar === 4) bass(bar.bass, nextTime, STEP * 2.4);
      pluck(bar.pad[ARP[inBar]], nextTime);
      hat(nextTime, inBar % 4 === 0);
      nextTime += STEP;
      step++;
    }
  }

  return {
    isOn: function () { return on; },
    toggle: function () {
      init();
      if (ctx.state === "suspended") ctx.resume();
      on = !on;
      if (on) {
        musicBus.gain.cancelScheduledValues(ctx.currentTime);
        musicBus.gain.setValueAtTime(musicBus.gain.value, ctx.currentTime);
        musicBus.gain.linearRampToValueAtTime(0.6, ctx.currentTime + 0.7);
        if (!timer) {
          nextTime = ctx.currentTime + 0.08;
          timer = setInterval(tick, 25);
        }
      } else {
        musicBus.gain.cancelScheduledValues(ctx.currentTime);
        musicBus.gain.setValueAtTime(musicBus.gain.value, ctx.currentTime);
        musicBus.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
        clearInterval(timer); timer = null;
      }
      return on;
    },
    // The press coming down on paper.
    chunk: function () {
      if (!on || !ctx) return;
      var t = ctx.currentTime;
      var s = ctx.createBufferSource(), g = ctx.createGain(), bp = ctx.createBiquadFilter();
      s.buffer = noise;
      bp.type = "bandpass"; bp.frequency.value = 1500; bp.Q.value = 0.9;
      g.gain.setValueAtTime(0.28, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      s.connect(bp); bp.connect(g); g.connect(master);
      s.start(t); s.stop(t + 0.14);

      var o = ctx.createOscillator(), og = ctx.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(180, t);
      o.frequency.exponentialRampToValueAtTime(52, t + 0.11);
      og.gain.setValueAtTime(0.16, t);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      o.connect(og); og.connect(master);
      o.start(t); o.stop(t + 0.14);
    }
  };
})();

  var MOODS = [
    { k:"all", label:"Everything" }, { k:"rough", label:"Rough day" },
    { k:"anxious", label:"Anxious" }, { k:"stuck", label:"Stuck" },
    { k:"tired", label:"Worn out" }, { k:"laugh", label:"Need a laugh" },
    { k:"good", label:"Good news" }
  ];

  var moodsEl = document.getElementById("moods");
  var slip = document.getElementById("slip");
  var msgEl = document.getElementById("msg"), ghostEl = document.getElementById("ghost");
  var tagEl = document.getElementById("tag"), runEl = document.getElementById("runno");
  var cImg = document.getElementById("cosignImg"), cName = document.getElementById("cosignName");
  var cFact = document.getElementById("cosignFact"), toastEl = document.getElementById("toast");

  var active = "all", bag = [], cosignBag = [], current = null, currentCo = null, printed = 0;

  MOODS.forEach(function (mood) {
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = mood.label;
    b.setAttribute("aria-pressed", mood.k === active ? "true" : "false");
    b.addEventListener("click", function () {
      active = mood.k;
      Array.prototype.forEach.call(moodsEl.children, function (c) {
        c.setAttribute("aria-pressed", c === b ? "true" : "false");
      });
      bag = [];
      print();
    });
    moodsEl.appendChild(b);
  });

  function pool() { return active === "all" ? DECK : DECK.filter(function (d) { return d.m === active; }); }

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function print() {
    if (!bag.length) {
      bag = shuffled(pool());
      // Avoid handing back the same slip twice across a reshuffle.
      if (bag.length > 1 && current && bag[bag.length - 1].x === current.x) bag.unshift(bag.pop());
    }
    if (!cosignBag.length) {
      cosignBag = shuffled(PORTRAITS);
      if (cosignBag.length > 1 && currentCo && cosignBag[cosignBag.length - 1].n === currentCo.n) cosignBag.unshift(cosignBag.pop());
    }

    current = bag.pop();
    currentCo = cosignBag.pop();
    printed++;

    msgEl.textContent = current.x;
    ghostEl.textContent = current.x;
    tagEl.textContent = current.t;
    cImg.src = currentCo.img;
    cImg.alt = "Portrait of " + currentCo.n;
    cName.textContent = currentCo.n;
    cFact.textContent = currentCo.f;
    runEl.textContent = "No. " + String(printed).padStart(3, "0") + " / edition of " + pool().length;

    slip.classList.add("printing");
    void slip.offsetWidth;
    requestAnimationFrame(function () { slip.classList.remove("printing"); });
    Sound.chunk();
  }

  var toastTimer;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }

  document.getElementById("press").addEventListener("click", print);

  var soundBtn = document.getElementById("sound"), soundLabel = document.getElementById("soundLabel");
  soundBtn.addEventListener("click", function () {
    var on;
    try { on = Sound.toggle(); }
    catch (e) { toast("Audio unavailable here"); return; }
    soundBtn.setAttribute("aria-pressed", on ? "true" : "false");
    soundLabel.textContent = on ? "Music on" : "Music off";
  });

  document.getElementById("copy").addEventListener("click", function () {
    var text = current.x + "\n\nCo-signed by " + currentCo.n + ": " + currentCo.f + "\n\n— Pep Talk Press";
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? "Copied" : "Select and copy the text");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("Copied"); }, fallback);
    } else { fallback(); }
  });

  document.addEventListener("keydown", function (e) {
    var el = (e.target.tagName || "").toLowerCase();
    // Buttons and fields answer space/enter themselves; don't print twice.
    if (el === "button" || el === "input" || el === "textarea" || el === "a") return;
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); print(); }
  });

  print();
})();
